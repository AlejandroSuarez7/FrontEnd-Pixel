sonar.projectKey=pixel-frontend
sonar.projectName=Pixel Frontend
sonar.projectVersion=1.0

# Código productivo y pruebas comparten src, pero se clasifican explícitamente.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/*.spec.js,src/**/*.spec.jsx
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/*.spec.js,src/**/*.spec.jsx,src/test/**

# Cobertura real generada por npm run test:coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/*.spec.js,src/**/*.spec.jsx,src/test/**

sonar.sourceEncoding=UTF-8
